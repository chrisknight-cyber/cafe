<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Image Editor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#ffe6e6;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.container{
    display:flex;
    gap:40px;
}

.left{
    width:45%;
}

.right{
    width:55%;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

.image-box{
    width:500px;
    height:400px;
    margin-top:20px;
    background:#fff;
    border:2px solid #ccc;
    display:flex;
    justify-content:center;
    align-items:center;
}

canvas{
    max-width:100%;
    max-height:100%;
}

.control{
    margin-bottom:18px;
}

.control label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.control input{
    width:100%;
}

button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
}

hr{
    margin:20px 0;
}
</style>

</head>
<body>

<h1>Advanced Image Editor</h1>

<div class="container">

<div class="left">

<input type="file" id="upload" accept="image/*">

<div class="image-box">
<canvas id="canvas"></canvas>
</div>

</div>

<div class="right">

<div class="control">
<label>Brightness</label>
<input type="range" id="brightness" min="0" max="200" value="100">
</div>

<div class="control">
<label>Contrast</label>
<input type="range" id="contrast" min="0" max="200" value="100">
</div>

<div class="control">
<label>Saturation</label>
<input type="range" id="saturation" min="0" max="200" value="100">
</div>

<div class="control">
<label>Grayscale</label>
<input type="range" id="grayscale" min="0" max="100" value="0">
</div>

<div class="control">
<label>Sepia</label>
<input type="range" id="sepia" min="0" max="100" value="0">
</div>

<div class="control">
<label>Blur</label>
<input type="range" id="blur" min="0" max="10" value="0">
</div>

</div>

</div>

<script>

const upload=document.getElementById("upload");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const image=new Image();

let brightness=100;
let contrast=100;
let saturation=100;
let grayscale=0;
let sepia=0;
let blur=0;

let rotation=0;
let flipX=1;
let flipY=1;

upload.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(event){

image.src=event.target.result;

}

reader.readAsDataURL(file);

});

image.onload=function(){

canvas.width=image.width;
canvas.height=image.height;

drawImage();

}

function drawImage(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.save();

ctx.filter=
`
brightness(${brightness}%)
contrast(${contrast}%)
saturate(${saturation}%)
grayscale(${grayscale}%)
sepia(${sepia}%)
blur(${blur}px)
`;

ctx.translate(canvas.width/2,canvas.height/2);

ctx.rotate(rotation*Math.PI/180);

ctx.scale(flipX,flipY);

ctx.drawImage(
image,
-image.width/2,
-image.height/2
);

ctx.restore();

}

document.getElementById("brightness").oninput=function(){

brightness=this.value;
drawImage();

}

document.getElementById("contrast").oninput=function(){

contrast=this.value;
drawImage();

}

document.getElementById("saturation").oninput=function(){

saturation=this.value;
drawImage();

}

document.getElementById("grayscale").oninput=function(){

grayscale=this.value;
drawImage();

}

document.getElementById("sepia").oninput=function(){

sepia=this.value;
drawImage();

}

document.getElementById("blur").oninput=function(){

blur=this.value;
drawImage();

}

</script>

</body>
</html>
